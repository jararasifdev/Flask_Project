version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${DB_USER:-flaskuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-flaskpassword}
      - POSTGRES_DB=${DB_NAME:-flaskdb}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 run:app
    volumes:
      - .:/app
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-flaskuser}:${DB_PASSWORD:-flaskpassword}@db:5432/${DB_NAME:-flaskdb}
      - SECRET_KEY=${SECRET_KEY:-mysecretkey}
      - FLASK_APP=run.py
      - FLASK_ENV=production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
